name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Non bloquant pour l'instant : 18 erreurs `react-hooks` préexistantes
      # dans evidence-table.tsx et dashboard.tsx (mémoïsations que le React
      # Compiler ne peut pas préserver). À traiter lors du découpage de ces
      # deux composants, puis retirer `continue-on-error`.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Tests
        run: npm test
